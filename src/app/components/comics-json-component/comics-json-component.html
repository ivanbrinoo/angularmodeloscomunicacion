<h3>Funcional</h3>
<button (click)="mostrarComics()" class="btn btn-info">Mostrar Comics</button>
@for (tebeo of arraycomics; track tebeo){
    <p style="color:blue">Nombre: {{tebeo.titulo}}</p>
    <p style="color:blue">Descripcion: {{tebeo.descripcion}}</p>
    <p style="color:blue"><img src="{{tebeo.imagen}}" style="width: 30%; height: 40%;"></p>
    
}
