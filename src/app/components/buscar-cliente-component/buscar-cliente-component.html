<form formulario="ngForm">
    Introduce la ID:
    <select name="cajaid" #cajaid>
            @for(cli of arrayclientes; track cli){
                <option value="{{cli.idcliente}}">{{cli.nombre}}</option>
            }
    </select>
    <button type="button" (click)="mostrarClientes()">
        Buscar
    </button>
</form>
@if(cliente){
<h2>ID: {{cliente.idcliente}}</h2>
<h2>Nombre: {{cliente.nombre}}</h2>
<h2><a href="{{cliente.paginaweb}}">{{cliente.paginaweb}}</a></h2>
<h2><img src="{{cliente.imagencliente}}" style="width: 40%; height: 40%;"></h2>
}
